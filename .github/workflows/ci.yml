name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma 8 contract
        run: npm run prisma8:emit

      - name: Validate Prisma 7 schema + migration history (offline, no database)
        run: |
          npm run prisma:validate
          npm run prisma:drift-check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  ruflo-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AI Income Lab
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match the validate job so both jobs run the same tsx/Node runtime.
          node-version: 24

      - name: Install AI Income Lab dependencies
        # Match the validate job: the prisma8 lockfile is not guaranteed to be
        # npm-ci-sync, so install like main's green baseline does.
        run: npm install

      - name: Checkout Ruflo
        uses: actions/checkout@v4
        with:
          repository: ruvnet/ruflo
          ref: 9c61c86f06b439af2a95085ae9bb0ca839662e41
          path: .ci/ruflo

      - name: Install Ruflo dependencies
        working-directory: .ci/ruflo
        run: npm ci

      - name: Patch Ruflo type-only re-exports for runtime execution
        working-directory: .ci/ruflo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v3/mcp/transport/index.ts')
          s = p.read_text()
          # The barrel re-exports TypeScript-only config interfaces as runtime
          # values, which crashes Node ESM loading under tsx (the interfaces do
          # not exist at runtime). Convert each config re-export to a type-only
          # export; classes stay runtime exports. Verified against the pinned
          # commit 9c61c86f06b439af2a95085ae9bb0ca839662e41.
          replacements = {
              "export { StdioTransport, StdioTransportConfig } from './stdio.js';":
                  "export { StdioTransport } from './stdio.js';\nexport type { StdioTransportConfig } from './stdio.js';",
              "export { HttpTransport, HttpTransportConfig } from './http.js';":
                  "export { HttpTransport } from './http.js';\nexport type { HttpTransportConfig } from './http.js';",
              "export { WebSocketTransport, WebSocketTransportConfig } from './websocket.js';":
                  "export { WebSocketTransport } from './websocket.js';\nexport type { WebSocketTransportConfig } from './websocket.js';",
          }
          for old, new in replacements.items():
              assert old in s, f'expected barrel line missing at pin: {old}'
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Start Ruflo V3 HTTP runtime
        working-directory: .ci/ruflo
        run: |
          # Real V3 HTTP server: binds exactly 127.0.0.1:3000 (HTTP transport
          # listen(port, host)); serves GET /health, POST /rpc and /mcp.
          nohup npx tsx v3/mcp/server-entry.ts --transport http --host 127.0.0.1 --port 3000 > /tmp/ruflo.log 2>&1 &
          echo $! > /tmp/ruflo.pid

      - name: Wait for Ruflo health
        run: |
          # Cold start (tsx compile + full tool registry) can take a while;
          # fail fast if the process dies instead of waiting out the loop.
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/health -o /tmp/ruflo-health.json; then
              cat /tmp/ruflo-health.json
              grep -q '"status":"ok"' /tmp/ruflo-health.json || { echo 'Unexpected /health body'; cat /tmp/ruflo.log; exit 1; }
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ruflo.pid)" 2>/dev/null; then
              echo 'Ruflo runtime process exited early:'
              cat /tmp/ruflo.log
              exit 1
            fi
            sleep 2
          done
          echo 'Timed out waiting for Ruflo /health:'
          cat /tmp/ruflo.log
          exit 1

      - name: Run live Ruflo integration smoke test
        env:
          RUFLO_LIVE_TEST_URL: http://127.0.0.1:3000
        run: npx tsx --test src/lib/ruflo/__tests__/live-runtime.test.ts

      - name: Dump Ruflo logs on failure
        if: failure()
        run: cat /tmp/ruflo.log
