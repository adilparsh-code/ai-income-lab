name: DeepSeek Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get PR diff
        run: git diff origin/${{ github.base_ref }}...HEAD > diff.txt
      - name: Call DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.sk-b5e5d63cdd7e44189476b13f729aafd5 }}
        run: |
          curl -X POST https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $sk-b5e5d63cdd7e44189476b13f729aafd5" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "deepseek-chat",
              "messages": [{"role": "user", "content": "Review this code diff:\n'"$(cat diff.txt)"'"}]
            }' > response.json
      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = JSON.parse(fs.readFileSync('response.json', 'utf8'));
            const review = response.choices[0].message.content;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 DeepSeek Review:\n\n${review}`
            });
