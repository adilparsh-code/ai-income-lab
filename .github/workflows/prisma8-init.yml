name: Generate Prisma 8 Initial Migration

on:
  push:
    branches: [main]
    paths:
      - "prisma8/contract.prisma"
      - "prisma.config.ts"
      - ".github/workflows/prisma8-init.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run prisma8:emit
      - run: npx prisma migration plan --name init
      - name: Commit generated Prisma 8 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations generated/prisma8
          git diff --cached --quiet || git commit -m "chore(prisma8): add initial migration"
          git push
      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/prisma8-init.yml
          git commit -m "chore(prisma8): remove one-off migration generator"
          git push
